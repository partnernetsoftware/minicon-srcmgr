[workspace]
resolver = "3"
members = [
    "crates/srcmgr-domain",
    "crates/srcmgr-git",
    "crates/srcmgr-state",
    "crates/srcmgr-ui",
    "crates/srcmgr-cli",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/partnernetsoftware/minicon-srcmgr"

# MiniCon is consumed only at an immutable, published revision (PRD 02, ARCH-01).
# Never switch these to a path, branch or uncommitted sibling checkout.
[workspace.dependencies]
minicon-core = { git = "https://github.com/partnernetsoftware/minicon", rev = "5aa3a8a8893b311d07b503f4b0a45e896727f3b9" }
minicon-platform = { git = "https://github.com/partnernetsoftware/minicon", rev = "5aa3a8a8893b311d07b503f4b0a45e896727f3b9", default-features = false, features = ["contained-process-spawn"] }
# ui-core default features are empty; terminal-selection (vt100) stays off (PRD 02).
minicon-ui-core = { git = "https://github.com/partnernetsoftware/minicon", rev = "5aa3a8a8893b311d07b503f4b0a45e896727f3b9", default-features = false }

srcmgr-domain = { path = "crates/srcmgr-domain" }
srcmgr-git = { path = "crates/srcmgr-git" }
srcmgr-state = { path = "crates/srcmgr-state" }
srcmgr-ui = { path = "crates/srcmgr-ui" }
# Trust fingerprints need a collision-resistant hash; MiniCon checksums are not one.
sha2 = { version = "0.11", default-features = false }
# Durable profile state (PRD 13). Bundled SQLite gives consistent native builds.
rusqlite = { version = "0.37", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
