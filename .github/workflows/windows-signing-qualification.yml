name: Windows signing qualification and release

# Manual candidate signer for the Azure Artifact Signing path. The default run is
# a non-promotable qualification (release_eligible=false). A release-eligible
# run requires checked-in signing.mode=required, an unpublished version, and
# records release_eligible=true only after the canonical inspector reports Valid
# with the company organization and a timestamp. There is no unsigned fallback.
on:
  workflow_dispatch:
    inputs:
      confirm_provisioned:
        description: Azure Artifact Signing and the release-signing environment are configured for this repository
        type: boolean
        default: false
      release_eligible:
        description: Produce a release-eligible receipt (requires signing.mode=required)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  guard:
    runs-on: windows-latest
    steps:
      - name: Refuse to run before provisioning
        if: ${{ !inputs.confirm_provisioned }}
        run: |
          Write-Error 'Set confirm_provisioned only after the release-signing environment holds the Azure values and the profile-scoped signer role is assigned.'
          exit 1
        shell: pwsh
  build:
    needs: guard
    runs-on: windows-latest
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Release preflight
        id: preflight
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version = "(.*)"$').Matches.Groups[1].Value
          $policy = Get-Content release-policy.json | ConvertFrom-Json
          if ($policy.version -ne $version) { throw "release policy version $($policy.version) does not match $version" }
          if ('${{ inputs.release_eligible }}' -eq 'true') {
            if ($policy.signing.mode -ne 'required') { throw 'a release-eligible run needs signing.mode=required' }
            git ls-remote --exit-code --tags origin "refs/tags/v$version" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "v$version is already published" }
            if ($LASTEXITCODE -ne 2) { throw 'the remote tag state is unavailable' }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - name: Pinned toolchain cache
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Build the bound unsigned candidate
        run: python scripts/build_windows_candidate.py --out target/qualification/ci-signed-input
      - name: Require product identity and an unsigned input
        shell: pwsh
        run: |
          $exe = 'target/qualification/ci-signed-input/candidate/minicon-srcmgr.exe'
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'MiniCon SrcMgr') { throw 'ProductName resource missing' }
          if (-not $info.ProductVersion) { throw 'ProductVersion resource missing' }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "signing input is already signed or unreadable: $($sig.Status)"
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath target/qualification/ci-signed-input/unsigned-sha256.txt -Value $hash -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate
          path: target/qualification/ci-signed-input
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: build
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ELIGIBLE: ${{ inputs.release_eligible }}
      PRODUCT_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-candidate
          path: signing-input
      - name: Freeze the unsigned signing input
        shell: pwsh
        run: |
          $exe = 'signing-input/candidate/minicon-srcmgr.exe'
          $expected = (Get-Content signing-input/unsigned-sha256.txt -Raw).Trim()
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw 'unsigned bytes differ from the build receipt' }
          # The catalog holds paths relative to its own directory, one per line.
          @('candidate\minicon-srcmgr.exe') |
            Set-Content -LiteralPath signing-input/signing-catalog.txt -Encoding ascii
          "UNSIGNED_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Azure login (GitHub OIDC federated identity, signer role only)
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29 # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the candidate executable
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: signing-input/signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: MiniCon SrcMgr
          description-url: https://github.com/partnernetsoftware/minicon-srcmgr
          exclude-workload-identity-credential: true
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          # azure/login created the CLI session this action consumes.
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
      - name: Inspect the signed executable
        shell: pwsh
        run: |
          $exe = 'signing-input/candidate/minicon-srcmgr.exe'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/inspect-authenticode.ps1 `
            -Path $exe -ExpectedOrganization 'PARTNERNET SOFTWARE PTY LTD' `
            -ExpectedProductName 'MiniCon SrcMgr' -ExpectedProductVersion $env:PRODUCT_VERSION `
            | Set-Content -LiteralPath inspection.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "inspector exited $LASTEXITCODE" }
      - name: Write and audit the public receipt
        shell: pwsh
        run: |
          python scripts/signing_receipt.py --asset signing-input/candidate/minicon-srcmgr.exe `
            --name minicon-srcmgr.exe --relative-path candidate/minicon-srcmgr.exe `
            --before-sha256 $env:UNSIGNED_SHA256 --inspection inspection.json `
            --source-sha $env:GITHUB_SHA --version $env:PRODUCT_VERSION `
            --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --release-eligible $env:RELEASE_ELIGIBLE --out signing-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'receipt composition failed' }
          python scripts/audit-public-signing-receipt.py signing-receipt.json `
            --expected-provider azure-artifact-signing --expected-publisher 'PARTNERNET SOFTWARE PTY LTD' `
            --release-eligible $env:RELEASE_ELIGIBLE
          if ($LASTEXITCODE -ne 0) { throw 'receipt audit failed' }
      - name: Keep the signed bytes and their receipt
        uses: actions/upload-artifact@v4
        with:
          name: signed-candidate
          path: |
            signing-input/candidate/minicon-srcmgr.exe
            signing-receipt.json
            inspection.json
          if-no-files-found: error
          retention-days: 7
