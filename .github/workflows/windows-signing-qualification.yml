name: Windows signing qualification and release

# Manual candidate signer for the Azure Artifact Signing path. It builds both
# Windows cells on their own native runners, signs the exact uploaded bytes in
# one provider call, and inspects each file with the canonical inspector.
#
# The default run is a non-promotable qualification (release_eligible=false).
# A release-eligible run requires checked-in signing.mode=required, an
# unpublished version, and records release_eligible=true only after every file
# is Valid with the company organization and a timestamp. There is no unsigned
# fallback.
on:
  workflow_dispatch:
    inputs:
      confirm_provisioned:
        description: Azure Artifact Signing and the release-signing environment are configured for this repository
        type: boolean
        default: false
      release_eligible:
        description: Produce a release-eligible receipt (requires signing.mode=required)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  guard:
    runs-on: windows-latest
    steps:
      - name: Refuse to run before provisioning
        if: ${{ !inputs.confirm_provisioned }}
        run: |
          Write-Error 'Set confirm_provisioned only after the release-signing environment holds the Azure values and the profile-scoped signer role is assigned.'
          exit 1
        shell: pwsh
  build:
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: win-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {cell: win-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc}
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Release preflight
        id: preflight
        shell: pwsh
        run: |
          # Native command failures are inspected explicitly, so a non-zero exit
          # reports its own reason instead of aborting the step opaquely.
          $ErrorActionPreference = 'Continue'
          $version = (Get-Content Cargo.toml | Select-String '^version = "(.*)"$').Matches.Groups[1].Value
          $policy = Get-Content release-policy.json | ConvertFrom-Json
          if ($policy.version -ne $version) { Write-Error "release policy version $($policy.version) does not match $version"; exit 1 }
          if ('${{ inputs.release_eligible }}' -eq 'true') {
            if ($policy.signing.mode -ne 'required') { Write-Error 'a release-eligible run needs signing.mode=required'; exit 1 }
            $tags = git ls-remote --tags origin
            if ($LASTEXITCODE -ne 0) { Write-Error 'the remote tag state is unavailable'; exit 1 }
            if ($tags -match "(?m)^\S+\s+refs/tags/v$([regex]::Escape($version))$") { Write-Error "v$version is already published"; exit 1 }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - name: Pinned toolchain cache
        run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Build the bound unsigned candidate for this cell
        run: |
          python scripts/build_windows_candidate.py --out target/qualification/ci-signed-input --target ${{ matrix.target }}
        shell: pwsh
      - name: Require product identity and an unsigned input
        shell: pwsh
        run: |
          $exe = 'target/qualification/ci-signed-input/candidate/minicon-srcmgr.exe'
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'MiniCon SrcMgr') { throw 'ProductName resource missing' }
          if (-not $info.ProductVersion) { throw 'ProductVersion resource missing' }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "signing input is already signed or unreadable: $($sig.Status)"
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath target/qualification/ci-signed-input/unsigned-sha256.txt -Value $hash -Encoding utf8
          Set-Content -LiteralPath target/qualification/ci-signed-input/cell.txt -Value '${{ matrix.cell }}' -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.cell }}
          path: target/qualification/ci-signed-input
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: build
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ELIGIBLE: ${{ inputs.release_eligible }}
      PRODUCT_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: unsigned
      - name: Freeze the signing input and build its manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force signing-input/cells | Out-Null
          $entries = @()
          foreach ($cell in @('win-x86_64','win-aarch64')) {
            $source = "unsigned/unsigned-$cell/candidate/minicon-srcmgr.exe"
            if (-not (Test-Path $source)) { throw "missing unsigned input for $cell" }
            $expected = (Get-Content "unsigned/unsigned-$cell/unsigned-sha256.txt" -Raw).Trim()
            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected) { throw "$cell unsigned bytes differ from the build receipt" }
            New-Item -ItemType Directory -Force "signing-input/cells/$cell" | Out-Null
            Copy-Item $source "signing-input/cells/$cell/minicon-srcmgr.exe"
            $entries += [ordered]@{
              cell = $cell
              path = "signing-input/cells/$cell/minicon-srcmgr.exe"
              relative_path = "cells/$cell/minicon-srcmgr.exe"
              inspection = "inspection-$cell.json"
              before_sha256 = $hash
            }
          }
          @('cells\win-x86_64\minicon-srcmgr.exe', 'cells\win-aarch64\minicon-srcmgr.exe') |
            Set-Content -LiteralPath signing-input/signing-catalog.txt -Encoding ascii
          # Run identifiers passed Int32 in 2025; the receipt schema takes them as
          # integers, so read them as Int64 rather than truncating.
          $manifest = [ordered]@{ version = $env:PRODUCT_VERSION; run_id = [long]$env:GITHUB_RUN_ID; run_attempt = [long]$env:GITHUB_RUN_ATTEMPT; assets = $entries }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath signing-manifest.json -Encoding utf8
      - name: Azure login (GitHub OIDC federated identity, signer role only)
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29 # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign both Windows cells
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: signing-input/signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: MiniCon SrcMgr
          description-url: https://github.com/partnernetsoftware/minicon-srcmgr
          exclude-workload-identity-credential: true
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          # azure/login created the CLI session this action consumes.
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
      - name: Inspect every signed file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($cell in @('win-x86_64','win-aarch64')) {
            $exe = "signing-input/cells/$cell/minicon-srcmgr.exe"
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/inspect-authenticode.ps1 `
              -Path $exe -ExpectedOrganization 'PARTNERNET SOFTWARE PTY LTD' `
              -ExpectedProductName 'MiniCon SrcMgr' -ExpectedProductVersion $env:PRODUCT_VERSION `
              | Set-Content -LiteralPath "inspection-$cell.json" -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "$cell inspector exited $LASTEXITCODE" }
          }
      - name: Write and audit the public receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/signing_receipt.py --manifest signing-manifest.json `
            --source-sha $env:GITHUB_SHA --release-eligible $env:RELEASE_ELIGIBLE --out signing-receipt.json
          if ($LASTEXITCODE -ne 0) { throw 'receipt composition failed' }
          python scripts/audit-public-signing-receipt.py signing-receipt.json `
            --expected-provider azure-artifact-signing --expected-publisher 'PARTNERNET SOFTWARE PTY LTD' `
            --release-eligible $env:RELEASE_ELIGIBLE
          if ($LASTEXITCODE -ne 0) { throw 'receipt audit failed' }
      - name: Keep the signed bytes and their receipt
        uses: actions/upload-artifact@v4
        with:
          name: signed-candidates
          path: |
            signing-input/cells/win-x86_64/minicon-srcmgr.exe
            signing-input/cells/win-aarch64/minicon-srcmgr.exe
            signing-receipt.json
            inspection-win-x86_64.json
            inspection-win-aarch64.json
          if-no-files-found: error
          retention-days: 7
