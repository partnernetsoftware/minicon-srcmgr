name: Six native cells

# Build, execute and package MiniCon SrcMgr on each of the six supported
# OS/ISA cells, using one native runner per cell so nothing is cross-built.
# This is the same shape as MiniCon's six-grid build: a matrix of native
# runners, a runtime court on each cell's own executable, and an aggregate
# court that refuses a partial set.
#
# What this proves: each cell compiles from the same locked source, its
# executable starts, and it performs real Git reads on a fixture.
# What it does not prove: a GUI journey (needs a display and, on Linux, a
# compositor), Authenticode for the two Windows cells, or macOS Developer ID
# signing. Those are separate courts.
on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/six-cell.yml'
      - 'scripts/cell_runtime_court.py'
      - 'scripts/package_cell.py'
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
jobs:
  cell:
    name: cell ${{ matrix.cell }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: lnx-x86_64, runner: ubuntu-24.04, family: linux, expect_os: Linux, expect_arch: X64}
          - {cell: lnx-aarch64, runner: ubuntu-24.04-arm, family: linux, expect_os: Linux, expect_arch: ARM64}
          - {cell: win-x86_64, runner: windows-2025, family: windows, expect_os: Windows, expect_arch: X64}
          - {cell: win-aarch64, runner: windows-11-arm, family: windows, expect_os: Windows, expect_arch: ARM64}
          - {cell: osx-x86_64, runner: macos-15-intel, family: macos, expect_os: macOS, expect_arch: X64}
          - {cell: osx-aarch64, runner: macos-15, family: macos, expect_os: macOS, expect_arch: ARM64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Refuse an unexpected machine
        shell: bash
        run: |
          # Compare the runner's own identity with the cell it is meant to be.
          # The macOS runner ships bash 3.2, so no lowercase expansion here.
          set -euo pipefail
          test "${RUNNER_OS}" = "${{ matrix.expect_os }}"
          test "${RUNNER_ARCH}" = "${{ matrix.expect_arch }}"
      - name: Report the cell's Git
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          git --version
      - name: Build the cell
        shell: bash
        env:
          GIT_CONFIG_COUNT: "0"
        run: |
          # The fixtures run against the cell's own Git, by absolute path: the
          # product resolves the executable and rejects a bare name.
          #
          # On Windows, PATH from Git Bash reaches the SDK flavour under
          # ucrt64/bin, which reads a different etc/gitconfig and fails with
          # status 128 on this machine. Derive the supported front end from the
          # installation root instead of trusting PATH order, then hand the
          # product a native Windows path.
          set -euo pipefail
          resolved="$(command -v git)"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            exec_path="$(git --exec-path)"
            root="$(dirname "$(dirname "$(dirname "$exec_path")")")"
            resolved="$(cygpath -w "$root/cmd/git.exe")"
          fi
          export SRCMGR_TEST_GIT="$resolved"
          echo "court git: $SRCMGR_TEST_GIT"
          # Later steps reuse the same Git; the court reads SRCMGR_TEST_GIT.
          echo "SRCMGR_TEST_GIT=$resolved" >> "$GITHUB_ENV"

          # The image ships a global configuration (core.autocrlf on Windows,
          # init.defaultBranch elsewhere). The fixtures assert exact bytes, so
          # they run under an empty global and system config; ambient settings a
          # user may have are a separate, unqualified scenario.
          empty_config="$(mktemp)"
          export GIT_CONFIG_GLOBAL="$empty_config"
          export GIT_CONFIG_SYSTEM="$empty_config"
          export GIT_CONFIG_NOSYSTEM=1

          cargo build --locked --release -p srcmgr-cli
          cargo test --locked --workspace --no-fail-fast
      - name: Locate the executable
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.family }}" = windows ]; then
            name=minicon-srcmgr.exe
          else
            name=minicon-srcmgr
          fi
          path="target/release/$name"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Runtime court on this cell
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          python scripts/cell_runtime_court.py \
            --binary '${{ steps.binary.outputs.path }}' \
            --expected-version "$version" \
            --out runtime-receipt.json
      - name: Package the cell
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          python scripts/package_cell.py \
            --cell '${{ matrix.cell }}' \
            --binary '${{ steps.binary.outputs.path }}' \
            --readme docs/first-run.txt \
            --version "$version" \
            --source-sha "$GITHUB_SHA" \
            --runtime-status "$(python -c "import json;print(json.load(open('runtime-receipt.json'))['status'])")" \
            --signing "$( [ '${{ matrix.family }}' = windows ] && echo blocked || echo unsigned )" \
            --out "package/${{ matrix.cell }}"
      - name: Upload the cell
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cell-${{ matrix.cell }}
          path: |
            package/${{ matrix.cell }}/*
            runtime-receipt.json
          if-no-files-found: error
          retention-days: 7
  aggregate:
    name: require six native cells
    needs: cell
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cell-*
          merge-multiple: true
          path: cells
      - name: Refuse a partial or failed set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/six_cell_aggregate.py --cells cells --source-sha "$GITHUB_SHA" --out six-cell-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: six-cell-receipt
          path: six-cell-receipt.json
          if-no-files-found: error
          retention-days: 14
